apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 072025753815.dkr.ecr.us-east-1.amazonaws.com/frontend-login:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80