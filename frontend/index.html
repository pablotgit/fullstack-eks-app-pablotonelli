<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App EKS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="login-container">

        <h1>Login</h1>

        <input
            type="text"
            id="username"
            placeholder="Usuario"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button onclick="login()">
            Ingresar
        </button>

        <p id="message"></p>

    </div>

        <div class="gallery-container" id="gallery-container" style="display:none;">

        <h1>Galería de Imágenes</h1>

        <div class="gallery">
            <img src="https://picsum.photos/300/200?1">
            <img src="https://picsum.photos/300/200?2">
            <img src="https://picsum.photos/300/200?3">
            <img src="https://picsum.photos/300/200?4">
            <img src="https://picsum.photos/300/200?5">
            <img src="https://picsum.photos/300/200?6">
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
